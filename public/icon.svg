<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- AI chip icon -->
  <rect x="20" y="24" width="36" height="28" rx="6" fill="none" stroke="#6366f1" stroke-width="3"/>
  <rect x="28" y="32" width="20" height="12" rx="3" fill="#6366f1" opacity="0.3"/>
  <text x="38" y="44" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="bold" font-family="sans-serif">AI</text>
  <!-- Arrow right -->
  <path d="M60 38 L92 38" stroke="url(#arrow1)" stroke-width="5" stroke-linecap="round"/>
  <path d="M86 30 L94 38 L86 46" stroke="url(#arrow1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Robot/AI target icon -->
  <rect x="72" y="24" width="36" height="28" rx="6" fill="none" stroke="#22c55e" stroke-width="3"/>
  <circle cx="84" cy="38" r="4" fill="#22c55e"/>
  <circle cx="96" cy="38" r="4" fill="#22c55e"/>
  <line x1="84" y1="44" x2="96" y2="44" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <!-- Migration arrows -->
  <path d="M34 72 L94 72" stroke="url(#arrow2)" stroke-width="6" stroke-linecap="round"/>
  <path d="M86 63 L96 72 L86 81" stroke="url(#arrow2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M94 96 L34 96" stroke="url(#arrow1)" stroke-width="6" stroke-linecap="round"/>
  <path d="M42 87 L32 96 L42 105" stroke="url(#arrow1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Text -->
  <text x="64" y="122" text-anchor="middle" fill="#a1a1aa" font-size="10" font-family="sans-serif" letter-spacing="1">MIGRATE</text>
</svg>
